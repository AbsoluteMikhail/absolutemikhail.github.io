<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайные видео</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
        }
        #video-player {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <video id="video-player"></video>

    <script>
        const videos = [
            'video/Shmatko.mp4',
            'video/drunk-dancing.mp4',
            'video/chef.mp4',
            'video/dance_vagan.mp4',
            'video/hahaha.mp4',
            'video/Myhogyk.mp4'
        ];

        const videoPlayer = document.getElementById('video-player');
        let playedIndexes = [];

        function getRandomVideo() {
            if (playedIndexes.length === videos.length) {
                playedIndexes = [];
            }
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * videos.length);
            } while (playedIndexes.includes(randomIndex));

            playedIndexes.push(randomIndex);
            return videos[randomIndex];
        }

        // Эта функция будет вызываться из Unreal Engine
        window.startVideoLoop = function() {
            // Устанавливаем атрибуты muted и autoplay при запуске
            videoPlayer.muted = true;
            videoPlayer.autoplay = true;

            // Запускаем первое видео
            const nextVideo = getRandomVideo();
            videoPlayer.src = nextVideo;
            videoPlayer.load();
            videoPlayer.play();
        };

        // Слушаем событие "ended" (когда видео закончилось)
        videoPlayer.addEventListener('ended', () => {
            const nextVideo = getRandomVideo();
            videoPlayer.src = nextVideo;
            videoPlayer.load();
            videoPlayer.play();
        });
    </script>

</body>
</html>
