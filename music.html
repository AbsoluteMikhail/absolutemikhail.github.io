<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GamePunk Live Wallpaper</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .video-container {
      width: 1920px;
      height: 1080px;
      max-width: 100%;
      /* Начальное состояние: невидимый */
      opacity: 0;
      /* Анимация появления: длится 5 секунды, срабатывает 1 раз */
      animation: fadeInEffect 5s forwards;
    }

    @keyframes fadeInEffect {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <iframe id="wallpaper-video" 
      src="https://www.youtube-nocookie.com/embed/c5_mX-M7fmk?si=KwF1gA-HUxfz1FRm&enablejsapi=1&controls=0&mute=1&loop=1&playlist=c5_mX-M7fmk" 
      title="YouTube video player" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <script>
    // Загружаем API YouTube
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('wallpaper-video', {
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      // Ждем пока идет анимация CSS, и запускаем видео
      setTimeout(function() {
        event.target.playVideo();
      }, 1000);
    }
  </script>
</body>
</html>
