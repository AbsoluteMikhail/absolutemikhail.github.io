<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GamePunk Live Wallpaper Shuffle</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .video-container {
      width: 1920px;
      height: 1080px;
      max-width: 100%;
      opacity: 0; /* Изначально скрыто */
      transition: opacity 2s ease-in-out; /* Плавный переход прозрачности */
    }

    /* Класс для проявления */
    .fade-in { opacity: 1; }
    /* Класс для затухания */
    .fade-out { opacity: 0; }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="video-container" id="container">
    <iframe id="wallpaper-video" 
      src="" 
      title="YouTube video player" 
      allow="autoplay; encrypted-media" 
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <script>
    const videos = [
      "ApegC5BGrd4",
      "c5_mX-M7fmk",
      "1_2J3gKpbSQ",
      "QnISXAW2ZTQ",
      "PeB1aFZDpHw",
      "SM4HToR__xo"
    ];

    const iframe = document.getElementById('wallpaper-video');
    const container = document.getElementById('container');

    function changeVideo() {
      // 1. Сначала плавно гасим экран
      container.classList.remove('fade-in');
      container.classList.add('fade-out');

      setTimeout(() => {
        // 2. Выбираем случайное ID из списка
        const randomId = videos[Math.floor(Math.random() * videos.length)];
        
        // 3. Формируем ссылку (без лишних хвостов, только нужные параметры)
        const newSrc = `https://www.youtube-nocookie.com/embed/${randomId}?autoplay=1&mute=1&controls=0&rel=0&showinfo=0`;
        
        iframe.src = newSrc;

        // 4. Когда видео начало грузиться, плавно проявляем его
        // Небольшая задержка, чтобы iframe успел обновиться
        setTimeout(() => {
          container.classList.remove('fade-out');
          container.classList.add('fade-in');
        }, 500);

      }, 2000); // Время на полное затухание перед сменой
    }

    // Запускаем первое видео сразу
    changeVideo();

    // Ставим интервал на смену каждые 60 секунд
    // (60000 миллисекунд)
    setInterval(changeVideo, 60000);
  </script>
</body>
</html>
