<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Страница не найдена | Absolute Mikhail</title>
    <meta name="description" content="Страница не найдена. Вернитесь на сайт Absolute Mikhail про Unreal Engine 5, C++, gamedev и менторинг." />
    <script type="text/javascript">
      (function(l) {
        if (l.hostname.slice(0, 4) === 'www.') {
          l.replace(l.protocol + '//' + l.hostname.slice(4) + (l.port ? ':' + l.port : '') + l.pathname + l.search + l.hash);
        }
      }(window.location))
    </script>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. http://www.foo.tld/one/two?a=b#three --> http://www.foo.tld/?p=/one/two&q=a=b#three
      // For use with Single Page Applications on GitHub Pages
      (function(l) {
        if (l.hostname.slice(0, 4) === 'www.') {
          return;
        }
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash);
      }(window.location))
    </script>
  </head>
  <body>
    <main>
      <p>Страница не найдена. <a href="/">Перейти на главную</a></p>
    </main>
  </body>
</html>
