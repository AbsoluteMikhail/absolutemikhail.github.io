<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    .emote {
      position: absolute;
      bottom: 0;
      z-index: 100;
      pointer-events: none;
      filter: drop-shadow(0 0 3px #000);
      animation: fly var(--duration) linear forwards;
      animation-delay: var(--delay);
      will-change: transform;
      opacity: 0; /* Невидим до старта */
    }
    .emote img {
      animation: pulse 1.5s ease-in-out infinite, sway 2s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes fly {
      0% {
        transform: translateY(0) translateX(var(--start-x)) scale(0.7);
        opacity: 0;
      }
      10% {
        transform: translateY(-10vh) translateX(var(--start-x)) scale(1);
        opacity: 0.9;
      }
      90% {
        transform: translateY(-90vh) translateX(var(--start-x)) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-100vh) translateX(var(--start-x)) scale(1);
        opacity: 0;
      }
    }
    @keyframes pulse {
      0% {
        transform: scale(0.9);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(0.9);
      }
    }
    @keyframes sway {
      0% {
        transform: rotate(var(--sway-angle, 0deg));
      }
      50% {
        transform: rotate(calc(var(--sway-angle, 0deg) * -1));
      }
      100% {
        transform: rotate(var(--sway-angle, 0deg));
      }
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    // Все параметры в одном месте
    const config = {
      wsUrl: 'wss://twitchwebsocket.onrender.com',
      emoteSize: 50, // Размер смайликов (px)
      minFlyDuration: 20, // Мин. длительность полёта (сек)
      maxFlyDuration: 30, // Макс. длительность полёта (сек)
      maxDelay: 1.5, // Макс. задержка появления (сек)
      spreadWidth: 100, // Ширина распределения по экрану (%)
      swayAngle: 10, // Макс. угол поворота для покачивания (градусы)
      pingUrl: 'https://twitchwebsocket.onrender.com/', // URL для пинга
      pingInterval: 10 * 60 * 1000 // Пинг каждые 10 минут
    };

    const container = document.getElementById('container');
    let ws;

    function connectWebSocket() {
      ws = new WebSocket(config.wsUrl);

      ws.onopen = () => console.log('Connected to WebSocket server');
      ws.onclose = () => {
        console.log('WebSocket disconnected, reconnecting...');
        setTimeout(connectWebSocket, 3000);
      };
      ws.onerror = (err) => console.error('WebSocket error:', err);
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          console.log('Received from server:', data);
          if (data.type === 'emote' && data.emotes && data.emotes.length > 0) {
            console.log('Spawning', data.emotes.length, 'emotes');
            data.emotes.forEach(emote => {
              createEmote(emote.id, data.color);
            });
          } else {
            console.log('No emotes to spawn or invalid data');
          }
        } catch (err) {
          console.error('Error parsing WebSocket message:', err);
        }
      };
    }

    function createEmote(emoteId, color) {
      console.log('Creating emote with ID:', emoteId);
      const emote = document.createElement('div');
      emote.className = 'emote';
      const duration = Math.random() * (config.maxFlyDuration - config.minFlyDuration) + config.minFlyDuration;
      const delay = Math.random() * config.maxDelay;
      const startX = Math.random() * config.spreadWidth + (100 - config.spreadWidth) / 2;
      const swayAngle = Math.random() * config.swayAngle; // Случайный угол 0–5°
      emote.style.setProperty('--start-x', `${startX}vw`);
      emote.style.setProperty('--duration', `${duration}s`);
      emote.style.setProperty('--delay', `${delay}s`);
      emote.style.setProperty('--sway-angle', `${swayAngle}deg`);

      const img = document.createElement('img');
      img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/3.0`;
      img.width = config.emoteSize;
      img.height = config.emoteSize;
      img.style.opacity = '0.9';

      emote.appendChild(img);
      container.appendChild(emote);

      console.log(`Emote ID: ${emoteId}, Duration: ${duration}s, Delay: ${delay}s, StartX: ${startX}vw, SwayAngle: ${swayAngle}deg`);
      setTimeout(() => {
        console.log('Removing emote with ID:', emoteId);
        emote.remove();
      }, (duration + delay) * 1000);
    }

    // Функция для пинга сервера
    function pingServer() {
      fetch(config.pingUrl, { method: 'GET' })
        .then(response => {
          if (response.ok) {
            console.log('Server pinged successfully');
          } else {
            console.error('Ping failed with status:', response.status);
          }
        })
        .catch(err => console.error('Ping error:', err));
    }

    // Запуск пинга каждые 10 минут
    setInterval(pingServer, config.pingInterval);

    // Запуск
    connectWebSocket();
    pingServer(); // Немедленный пинг при загрузке
  </script>
</body>
</html>
