<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Twitch Bunnies & Emotes</title>
  <style>
    body {
      margin: 0;
            padding: 0; 
            background: transparent; 
      overflow: hidden;
      user-select: none;
    }
        canvas { 
            display: block;
            background: transparent;
    }
  </style>
</head>
<body>
    <script src="https://pixijs.download/release/pixi.js"></script>
  <script>
        // Configuration
    const config = {
      wsUrl: 'wss://twitchwebsocket.onrender.com',
            pingUrl: 'https://twitchwebsocket.onrender.com/',
            pingInterval: 10 * 60 * 1000, // 10 minutes
            maxBunnies: 10,
            bunnySize: 64,
            groundLevel: 100,
            emoteSize: 50,
            minFlyDuration: 20,
            maxFlyDuration: 30,
            maxDelay: 1.5,
            spreadWidth: 100,
            swayAngle: 10
        };

        // Global variables
        let app;
        let bunnyTexture;
        let bunnies = [];
    let ws;
        let emoteContainer;

        // Initialize the application
        async function init() {
            // Create PixiJS application
            app = new PIXI.Application();
            await app.init({ 
                background: 0x000000,
                backgroundAlpha: 0,
                resizeTo: window,
                antialias: true
            });
            document.body.appendChild(app.canvas);

            // Load bunny texture
            bunnyTexture = await PIXI.Assets.load('https://pixijs.com/assets/bunny.png');
            
            // Create emote container for flying emotes
            emoteContainer = new PIXI.Container();
            app.stage.addChild(emoteContainer);
            
            // Connect to WebSocket
            connectWebSocket();
            
            // Start ping interval
            setInterval(pingServer, config.pingInterval);
            pingServer(); // Immediate ping on load

            // Animation loop
            app.ticker.add(() => {
                bunnies.forEach(bunny => updateBunny(bunny));
            });

            // Handle resize
            window.addEventListener('resize', () => {
                const newGroundLevel = app.screen.height - config.groundLevel;
                bunnies.forEach(bunny => {
                    bunny.container.y = newGroundLevel;
                });
            });
        }

    function connectWebSocket() {
      ws = new WebSocket(config.wsUrl);

      ws.onopen = () => console.log('Connected to WebSocket server');
      ws.onclose = () => {
        console.log('WebSocket disconnected, reconnecting...');
        setTimeout(connectWebSocket, 3000);
      };
      ws.onerror = (err) => console.error('WebSocket error:', err);
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          console.log('Received from server:', data);
                    
                    if (data.type === 'chat_message' && data.user) {
                        console.log('New chat message from:', data.user);
                        addOrUpdateBunny(data.user, data.color);
                    }
                    
          if (data.type === 'emote' && data.emotes && data.emotes.length > 0) {
            console.log('Spawning', data.emotes.length, 'emotes');
            data.emotes.forEach(emote => {
                            createFlyingEmote(emote.id, data.color);
            });
          }
        } catch (err) {
          console.error('Error parsing WebSocket message:', err);
        }
      };
    }

        function addOrUpdateBunny(username, color) {
            // Check if bunny already exists
            let existingBunny = bunnies.find(bunny => bunny.username === username);
            
            if (existingBunny) {
                // Update existing bunny's last activity
                existingBunny.lastActivity = Date.now();
                console.log('Updated existing bunny for:', username);
                return;
            }

            // If we have max bunnies, remove the oldest one
            if (bunnies.length >= config.maxBunnies) {
                const oldestBunny = bunnies.reduce((oldest, current) => 
                    current.lastActivity < oldest.lastActivity ? current : oldest
                );
                removeBunny(oldestBunny);
                console.log('Removed oldest bunny:', oldestBunny.username);
            }

            // Create new bunny
            createBunny(username, color);
        }

        function createBunny(username, color) {
            console.log('Creating new bunny for:', username);
            
            // Create container
            const container = new PIXI.Container();
            app.stage.addChild(container);

            // Create bunny sprite
            const bunny = new PIXI.Sprite(bunnyTexture);
            bunny.anchor.set(0.5);
            bunny.width = config.bunnySize;
            bunny.height = config.bunnySize;
            
            // Apply user color to bunny
            if (color && color !== '#FF0000') {
                const colorInt = parseInt(color.replace('#', ''), 16);
                bunny.tint = colorInt;
            }
            
            container.addChild(bunny);

            // Create name tag
            const nameText = new PIXI.Text({
                text: username,
                style: {
                    fontFamily: 'Arial',
                    fontSize: 14,
                    fill: 0x000000,
                    align: 'center',
                    fontWeight: 'bold'
                }
            });

            const nameTag = new PIXI.Container();
            nameTag.y = -50;
            
            // Background for name tag
            const padding = 6;
            const nameTagBg = new PIXI.Graphics();
            nameTagBg.roundRect(
                -nameText.width/2 - padding, 
                -nameText.height/2 - padding, 
                nameText.width + padding * 2, 
                nameText.height + padding * 2, 
                6
            );
            nameTagBg.fill(0xFFFFFF);
            nameTagBg.alpha = 0.8;
            nameTagBg.stroke({ width: 2, color: 0x000000 });
            
            nameTag.addChild(nameTagBg);
            nameTag.addChild(nameText);
            nameText.anchor.set(0.5);
            container.addChild(nameTag);

            // Initial position
            const groundLevel = app.screen.height - config.groundLevel;
            container.x = 100 + (bunnies.length * 120) % (app.screen.width - 200);
            container.y = groundLevel;

            // Bunny state
            const bunnyState = {
                container,
                bunny,
                nameTag,
                username,
                color,
                isMoving: false,
                targetX: container.x,
                jumpPhase: 0,
                idleTimer: 0,
                isIdle: false,
                lastActivity: Date.now()
            };

            // Start with random delay
            setTimeout(() => {
                startNewMovement(bunnyState);
            }, Math.random() * 1000);

            // Make clickable
            container.eventMode = 'static';
            container.cursor = 'pointer';
            container.on('pointerdown', () => {
                if (bunnyState.isIdle) {
                    bunnyState.isIdle = false;
                    startNewMovement(bunnyState);
                }
            });

            bunnies.push(bunnyState);
        }

        function removeBunny(bunny) {
            const index = bunnies.indexOf(bunny);
            if (index > -1) {
                bunnies.splice(index, 1);
                app.stage.removeChild(bunny.container);
                bunny.container.destroy();
            }
        }

        function updateBunny(bunny) {
            if (bunny.isIdle) {
                bunny.idleTimer -= app.ticker.deltaMS;
                bunny.bunny.y = Math.sin(Date.now() * 0.002) * 2;
                
                if (bunny.idleTimer <= 0) {
                    bunny.isIdle = false;
                    startNewMovement(bunny);
                }
                return;
            }

            if (bunny.isMoving) {
                const direction = bunny.targetX > bunny.container.x ? 1 : -1;
                bunny.container.x += direction * 2;
                
                bunny.jumpPhase += 0.2;
                bunny.bunny.y = Math.sin(bunny.jumpPhase) * 15;
                
                bunny.bunny.scale.x = Math.abs(bunny.bunny.scale.x) * direction;
                
                if (Math.abs(bunny.container.x - bunny.targetX) < 5 || 
                    bunny.container.x < 50 || 
                    bunny.container.x > app.screen.width - 50) {
                    bunny.isMoving = false;
                    startIdle(bunny);
                }
            }
        }

        function startNewMovement(bunny) {
            const padding = 80;
            bunny.targetX = padding + Math.random() * (app.screen.width - padding * 2);
            bunny.isMoving = true;
            bunny.jumpPhase = 0;
        }

        function startIdle(bunny) {
            bunny.isIdle = true;
            bunny.idleTimer = 1000 + Math.random() * 2000;
            bunny.bunny.y = 0;
        }

        // Create flying emote
        function createFlyingEmote(emoteId, color) {
            console.log('Creating flying emote with ID:', emoteId);
            
            const flyingEmote = new PIXI.Container();
            flyingEmote.x = (app.screen.width - config.spreadWidth) / 2 + Math.random() * config.spreadWidth;
            flyingEmote.y = app.screen.height;
            
            const emoteSprite = new PIXI.Sprite(PIXI.Texture.from(`https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/3.0`));
            emoteSprite.anchor.set(0.5);
            emoteSprite.width = config.emoteSize;
            emoteSprite.height = config.emoteSize;
            flyingEmote.addChild(emoteSprite);
            
            // Emotes keep their original colors
            
            emoteContainer.addChild(flyingEmote);
            
            // Animation properties
            const duration = Math.random() * (config.maxFlyDuration - config.minFlyDuration) + config.minFlyDuration;
            const delay = Math.random() * config.maxDelay;
            const swayAngle = Math.random() * config.swayAngle;
            
            // Start animation after delay
      setTimeout(() => {
                const startTime = Date.now();
                const startY = flyingEmote.y;
                const targetY = -config.emoteSize;
                
                const animate = () => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // Easing function for smooth movement
                    const easeProgress = 1 - Math.pow(1 - progress, 3);
                    
                    flyingEmote.y = startY + (targetY - startY) * easeProgress;
                    
                    // Add swaying motion
                    flyingEmote.rotation = Math.sin(elapsed * 2) * (swayAngle * Math.PI / 180);
                    
                    // Add pulsing effect
                    const scale = 0.9 + 0.2 * Math.sin(elapsed * 4);
                    flyingEmote.scale.set(scale);
                    
                    // Add opacity fade
                    flyingEmote.alpha = progress < 0.1 ? progress * 10 : (progress > 0.9 ? (1 - progress) * 10 : 1);
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        emoteContainer.removeChild(flyingEmote);
                        flyingEmote.destroy();
                    }
                };
                
                animate();
            }, delay * 1000);
        }

        // Ping server function
    function pingServer() {
      fetch(config.pingUrl, { method: 'GET' })
        .then(response => {
          if (response.ok) {
            console.log('Server pinged successfully');
          } else {
            console.error('Ping failed with status:', response.status);
          }
        })
        .catch(err => console.error('Ping error:', err));
    }

        // Test function for debugging
        function testEmote() {
            createFlyingEmote('25', '#FF0000');
            console.log('Test emote created');
        }

        // Add test button for debugging
        window.addEventListener('load', () => {
            const testBtn = document.createElement('button');
            testBtn.textContent = 'Test Emote';
            testBtn.style.position = 'fixed';
            testBtn.style.top = '10px';
            testBtn.style.right = '10px';
            testBtn.style.zIndex = '1000';
            testBtn.onclick = testEmote;
            document.body.appendChild(testBtn);
        });

        // Start the app
        init();
  </script>
</body>
</html>
