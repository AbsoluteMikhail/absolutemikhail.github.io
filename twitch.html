<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Twitch Bunnies & Emotes</title>
  <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: transparent; 
            overflow: hidden;
            user-select: none;
            position: relative;
        }
        canvas { 
            display: block;
            background: transparent;
            position: relative;
            z-index: 10;
        }
        #emote-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .emote {
            position: absolute;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 3px #000);
            animation: fly var(--duration) linear forwards;
            animation-delay: var(--delay);
            will-change: transform;
            opacity: 0;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }
        .emote img {
            animation: pulse 1.5s ease-in-out infinite, sway 2s ease-in-out infinite;
            will-change: transform;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        @keyframes fly {
            0% {
                transform: translateY(0) translateX(var(--start-x)) scale(0.7) translateZ(0);
                opacity: 0;
            }
            10% {
                transform: translateY(-10vh) translateX(var(--start-x)) scale(1) translateZ(0);
                opacity: 0.9;
            }
            90% {
                transform: translateY(-90vh) translateX(var(--start-x)) scale(1) translateZ(0);
                opacity: 0.9;
            }
            100% {
                transform: translateY(-100vh) translateX(var(--start-x)) scale(1) translateZ(0);
                opacity: 0;
            }
        }
        @keyframes pulse {
            0% {
                transform: scale(0.9) translateZ(0);
            }
            50% {
                transform: scale(1.1) translateZ(0);
            }
            100% {
                transform: scale(0.9) translateZ(0);
            }
        }
        @keyframes sway {
            0% {
                transform: rotate(var(--sway-angle, 0deg)) translateZ(0);
            }
            50% {
                transform: rotate(calc(var(--sway-angle, 0deg) * -1)) translateZ(0);
            }
            100% {
                transform: rotate(var(--sway-angle, 0deg)) translateZ(0);
            }
        }
  </style>
</head>
  <body>
    <div id="emote-container"></div>
    <script src="https://pixijs.download/release/pixi.js"></script>
  <script>
        // Configuration
        const config = {
            wsUrl: 'wss://twitchwebsocket.onrender.com',
            pingUrl: 'https://twitchwebsocket.onrender.com/',
            pingInterval: 10 * 60 * 1000, // 10 minutes
            maxBunnies: 10,
            bunnySize: 64,
            groundLevel: 100,
            emoteSize: 50,
            minFlyDuration: 20,
            maxFlyDuration: 30,
            maxDelay: 1.5,
            spreadWidth: 100,
            swayAngle: 10,
            // Bunny lifecycle settings
            initialLifetime: 5 * 60 * 1000, // 5 minutes in milliseconds
            lifetimeExtension: 60 * 1000, // 1 minute per new message
            minSize: 0.1, // 10% of original size
            maxSize: 1.0, // 100% of original size
            updateInterval: 1000 // Update every second
        };

        // Global variables
        let app;
        let bunnyTexture;
        let bunnies = [];
        let ws;

        // Initialize the application
        async function init() {
            // Create PixiJS application
            app = new PIXI.Application();
            await app.init({ 
                background: 0x000000,
                backgroundAlpha: 0,
                resizeTo: window,
                antialias: true
            });
            document.body.appendChild(app.canvas);

            // Load bunny texture
            bunnyTexture = await PIXI.Assets.load('https://pixijs.com/assets/bunny.png');
            
            // Emotes will be created as DOM elements with CSS animations
            
            // Connect to WebSocket
            connectWebSocket();
            
            // Start ping interval
            setInterval(pingServer, config.pingInterval);
            pingServer(); // Immediate ping on load

            // Animation loop
            app.ticker.add(() => {
                bunnies.forEach(bunny => updateBunny(bunny));
            });

            // Lifecycle update loop
            setInterval(() => {
                updateBunnyLifecycle();
            }, config.updateInterval);

            // Handle resize
            window.addEventListener('resize', () => {
                const newGroundLevel = app.screen.height - config.groundLevel;
                bunnies.forEach(bunny => {
                    bunny.container.y = newGroundLevel;
                });
            });
        }

    function connectWebSocket() {
      ws = new WebSocket(config.wsUrl);

      ws.onopen = () => console.log('Connected to WebSocket server');
      ws.onclose = () => {
        console.log('WebSocket disconnected, reconnecting...');
        setTimeout(connectWebSocket, 3000);
      };
      ws.onerror = (err) => console.error('WebSocket error:', err);
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          console.log('Received from server:', data);
                    
                    if (data.type === 'chat_message' && data.user) {
                        console.log('New chat message from:', data.user);
                        addOrUpdateBunny(data.user, data.color);
                    }
                    
          if (data.type === 'emote' && data.emotes && data.emotes.length > 0) {
            console.log('Spawning', data.emotes.length, 'emotes');
            data.emotes.forEach(emote => {
                            createFlyingEmote(emote.id, data.color);
            });
          }
        } catch (err) {
          console.error('Error parsing WebSocket message:', err);
        }
      };
    }

        function addOrUpdateBunny(username, color) {
            // Check if bunny already exists
            let existingBunny = bunnies.find(bunny => bunny.username === username);
            
            if (existingBunny) {
                // Update existing bunny's last activity and extend lifetime (max 5 minutes)
                existingBunny.lastActivity = Date.now();
                const newLifetime = Math.min(existingBunny.lifetime + config.lifetimeExtension, config.initialLifetime);
                existingBunny.lifetime = newLifetime;
                // Don't increase maxLifetime - keep it at initial value
                console.log('Updated existing bunny for:', username, 'Lifetime extended to:', Math.round(existingBunny.lifetime / 1000), 'seconds');
                return;
            }

            // If we have max bunnies, remove the oldest one
            if (bunnies.length >= config.maxBunnies) {
                const oldestBunny = bunnies.reduce((oldest, current) => 
                    current.lastActivity < oldest.lastActivity ? current : oldest
                );
                removeBunny(oldestBunny);
                console.log('Removed oldest bunny:', oldestBunny.username);
            }

            // Create new bunny
            createBunny(username, color);
        }

        function createBunny(username, color) {
            console.log('Creating new bunny for:', username);
            
            // Create container
            const container = new PIXI.Container();
            app.stage.addChild(container);

            // Create bunny sprite
            const bunny = new PIXI.Sprite(bunnyTexture);
            bunny.anchor.set(0.5);
            bunny.width = config.bunnySize;
            bunny.height = config.bunnySize;
            
            // Apply user color to bunny
            if (color && color !== '#FF0000') {
                const colorInt = parseInt(color.replace('#', ''), 16);
                bunny.tint = colorInt;
            }
            
            container.addChild(bunny);

            // Create name tag
            const nameText = new PIXI.Text({
                text: username,
                style: {
                    fontFamily: 'Arial',
                    fontSize: 14,
                    fill: 0x000000,
                    align: 'center',
                    fontWeight: 'bold'
                }
            });

            const nameTag = new PIXI.Container();
            nameTag.y = -50;
            
            // Background for name tag
            const padding = 6;
            const nameTagBg = new PIXI.Graphics();
            nameTagBg.roundRect(
                -nameText.width/2 - padding, 
                -nameText.height/2 - padding, 
                nameText.width + padding * 2, 
                nameText.height + padding * 2, 
                6
            );
            nameTagBg.fill(0xFFFFFF);
            nameTagBg.alpha = 0.8;
            nameTagBg.stroke({ width: 2, color: 0x000000 });
            
            nameTag.addChild(nameTagBg);
            nameTag.addChild(nameText);
            nameText.anchor.set(0.5);
            container.addChild(nameTag);

            // Initial position
            const groundLevel = app.screen.height - config.groundLevel;
            container.x = 100 + (bunnies.length * 120) % (app.screen.width - 200);
            container.y = groundLevel;
            
            // Store ground level for reference
            bunnyState.groundLevel = groundLevel;

            // Bunny state
            const bunnyState = {
                container,
                bunny,
                nameTag,
                username,
                color,
                isMoving: false,
                targetX: container.x,
                jumpPhase: 0,
                idleTimer: 0,
                isIdle: false,
                lastActivity: Date.now(),
                // Lifecycle properties
                lifetime: config.initialLifetime,
                maxLifetime: config.initialLifetime,
                createdAt: Date.now(),
                originalSize: config.bunnySize
            };

            // Start with random delay
            setTimeout(() => {
                startNewMovement(bunnyState);
            }, Math.random() * 1000);

            // Make clickable
            container.eventMode = 'static';
            container.cursor = 'pointer';
            container.on('pointerdown', () => {
                if (bunnyState.isIdle) {
                    bunnyState.isIdle = false;
                    startNewMovement(bunnyState);
                }
            });

            bunnies.push(bunnyState);
        }

        function removeBunny(bunny) {
            const index = bunnies.indexOf(bunny);
            if (index > -1) {
                bunnies.splice(index, 1);
                app.stage.removeChild(bunny.container);
                bunny.container.destroy();
            }
        }

        function updateBunny(bunny) {
            if (bunny.isIdle) {
                bunny.idleTimer -= app.ticker.deltaMS;
                bunny.bunny.y = Math.sin(Date.now() * 0.002) * 2;
                
                if (bunny.idleTimer <= 0) {
                    bunny.isIdle = false;
                    startNewMovement(bunny);
                }
                return;
            }

            if (bunny.isMoving) {
                const direction = bunny.targetX > bunny.container.x ? 1 : -1;
                bunny.container.x += direction * 2;
                
                bunny.jumpPhase += 0.2;
                bunny.bunny.y = Math.sin(bunny.jumpPhase) * 15;
                
                bunny.bunny.scale.x = Math.abs(bunny.bunny.scale.x) * direction;
                
                if (Math.abs(bunny.container.x - bunny.targetX) < 5 || 
                    bunny.container.x < 50 || 
                    bunny.container.x > app.screen.width - 50) {
                    bunny.isMoving = false;
                    startIdle(bunny);
                }
            }
        }

        function startNewMovement(bunny) {
            const padding = 80;
            bunny.targetX = padding + Math.random() * (app.screen.width - padding * 2);
            bunny.isMoving = true;
            bunny.jumpPhase = 0;
        }

        function startIdle(bunny) {
            bunny.isIdle = true;
            bunny.idleTimer = 1000 + Math.random() * 2000;
            bunny.bunny.y = 0;
        }

        function updateBunnyLifecycle() {
            const now = Date.now();
            const bunniesToRemove = [];

            bunnies.forEach(bunny => {
                // Decrease lifetime
                bunny.lifetime -= config.updateInterval;
                
                // Calculate size based on remaining lifetime
                const lifetimeRatio = bunny.lifetime / bunny.maxLifetime;
                const sizeRatio = Math.max(lifetimeRatio, config.minSize);
                const newSize = bunny.originalSize * sizeRatio;
                
                // Update bunny size
                bunny.bunny.width = newSize;
                bunny.bunny.height = newSize;
                
                // Keep bunny on ground level - adjust container position
                const sizeDifference = bunny.originalSize - newSize;
                bunny.container.y = bunny.groundLevel + sizeDifference / 2;
                
                // Update name tag position and size based on new bunny size
                bunny.nameTag.y = -newSize / 2 - 20;
                
                // Scale name tag text proportionally
                const nameText = bunny.nameTag.children[1]; // The text element
                if (nameText) {
                    nameText.style.fontSize = Math.max(10, newSize * 0.2) + 'px';
                }
                
                // Debug logging removed
                
                // Check if bunny should be removed
                if (bunny.lifetime <= 0) {
                    bunniesToRemove.push(bunny);
                    console.log('Bunny expired:', bunny.username);
                }
            });

            // Remove expired bunnies
            bunniesToRemove.forEach(bunny => {
                removeBunny(bunny);
            });
        }

        // Create flying emote (original CSS-based approach)
        function createFlyingEmote(emoteId, color) {
            console.log('Creating flying emote with ID:', emoteId);
            
            const emote = document.createElement('div');
            emote.className = 'emote';
            const duration = Math.random() * (config.maxFlyDuration - config.minFlyDuration) + config.minFlyDuration;
            const delay = Math.random() * config.maxDelay;
            const startX = Math.random() * config.spreadWidth + (100 - config.spreadWidth) / 2;
            const swayAngle = Math.random() * config.swayAngle;
            
            emote.style.setProperty('--start-x', `${startX}vw`);
            emote.style.setProperty('--duration', `${duration}s`);
            emote.style.setProperty('--delay', `${delay}s`);
            emote.style.setProperty('--sway-angle', `${swayAngle}deg`);

            const img = document.createElement('img');
            img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/3.0`;
            img.width = config.emoteSize;
            img.height = config.emoteSize;
            img.style.opacity = '0.9';

            emote.appendChild(img);
            document.getElementById('emote-container').appendChild(emote);

            console.log(`Emote ID: ${emoteId}, Duration: ${duration}s, Delay: ${delay}s, StartX: ${startX}vw, SwayAngle: ${swayAngle}deg`);
            setTimeout(() => {
                console.log('Removing emote with ID:', emoteId);
                emote.remove();
            }, (duration + delay) * 1000);
        }

        // Ping server function
    function pingServer() {
      fetch(config.pingUrl, { method: 'GET' })
        .then(response => {
          if (response.ok) {
            console.log('Server pinged successfully');
          } else {
            console.error('Ping failed with status:', response.status);
          }
        })
        .catch(err => console.error('Ping error:', err));
    }

        // Test function for debugging
        function testEmote() {
            const randomColor = '#' + Math.floor(Math.random() * 16777215).toString(16);
            createFlyingEmote('25', randomColor);
            addOrUpdateBunny('TestUser' + Math.floor(Math.random() * 1000), randomColor);
            console.log('Test emote and bunny created with color:', randomColor);
        }

        // Add invisible test button for debugging
        window.addEventListener('load', () => {
            const testBtn = document.createElement('button');
            testBtn.textContent = 'Test Emote';
            testBtn.style.position = 'fixed';
            testBtn.style.top = '10px';
            testBtn.style.right = '10px';
            testBtn.style.zIndex = '1000';
            testBtn.style.opacity = '0';
            testBtn.style.background = 'transparent';
            testBtn.style.border = 'none';
            testBtn.style.color = 'transparent';
            testBtn.style.width = '100px';
            testBtn.style.height = '30px';
            testBtn.style.cursor = 'pointer';
            testBtn.style.transition = 'opacity 0.3s ease';
            
            // Show on hover
            testBtn.addEventListener('mouseenter', () => {
                testBtn.style.opacity = '1';
                testBtn.style.background = 'rgba(0,0,0,0.7)';
                testBtn.style.color = 'white';
                testBtn.style.border = '1px solid white';
            });
            
            // Hide on mouse leave
            testBtn.addEventListener('mouseleave', () => {
                testBtn.style.opacity = '0';
                testBtn.style.background = 'transparent';
                testBtn.style.color = 'transparent';
                testBtn.style.border = 'none';
            });
            
            testBtn.onclick = () => {
                testEmote();
                // Show button for 1 second after click
                testBtn.style.opacity = '1';
                testBtn.style.background = 'rgba(0,0,0,0.7)';
                testBtn.style.color = 'white';
                testBtn.style.border = '1px solid white';
                setTimeout(() => {
                    testBtn.style.opacity = '0';
                    testBtn.style.background = 'transparent';
                    testBtn.style.color = 'transparent';
                    testBtn.style.border = 'none';
                }, 1000);
            };
            document.body.appendChild(testBtn);
        });

        // Start the app
        init();
  </script>
</body>
</html>
